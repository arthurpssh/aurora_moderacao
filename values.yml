name: aurora-chat

containerPort: 3001
cpu: 0.25
memory: 512Mi

# O buffer das respostas da Aurora e o leitor da planilha ficam em memória: manter 1 réplica
replicaCount: 1

healthCheckPath: /api/health
periodSeconds: 30
timeoutSeconds: 5
successThreshold: 2
failureThreshold: 5

env:
  PROFILE: staging
  PORT: "3001"
  NEW_RELIC_ENABLED: "false"
  GOOGLE_CLIENT_EMAIL:
    secretKeyRef:
      name: aurora-chat-google-client-email
      key: GOOGLE_CLIENT_EMAIL
  GOOGLE_PRIVATE_KEY:
    secretKeyRef:
      name: aurora-chat-google-private-key
      key: GOOGLE_PRIVATE_KEY
  AURORA_SPREADSHEET_ID:
    secretKeyRef:
      name: aurora-chat-aurora-spreadsheet-id
      key: AURORA_SPREADSHEET_ID
  ASTROFLOW_WEBHOOK_URL:
    secretKeyRef:
      name: aurora-chat-astroflow-webhook-url
      key: ASTROFLOW_WEBHOOK_URL
  # Aba onde o Astroflow grava as mensagens da Aurora (colunas: space, mensagem, ts)
  AURORA_OUTBOX_SHEET: "Saida_Teste"
  # Intervalo de leitura da aba (a cota do Sheets é de 60 leituras/min por usuário)
  AURORA_OUTBOX_POLL_MS: "2500"

lb:
  type: internal
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://auth.hotmart.run/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.hotmart.run/login?rd=https://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email,X-Auth-Request-User"
  hosts:
  - host: aurora-chat.hotmart.run
    paths: ["/"]

imports:
- to: module.base-module.aws_ecr_repository.application-default-ecr[0]
  id: "aurora-chat"
