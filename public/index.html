<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/js/tema.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topo">
      <img class="avatar" src="/img/aurora-avatar.jpg" alt="Aurora" width="44" height="44">
      <div class="quem">
        <b>Aurora</b>
        <span id="subtitulo">Assistente de moderação do Reclame AQUI</span>
      </div>
      <button class="btn" id="btnStatus" type="button" title="Pergunta em que etapa o seu caso está">Status</button>
      <button class="btn" id="btnLimpar" type="button" title="Limpa a conversa desta tela e encerra o caso em andamento">Limpar e encerrar caso</button>
      <button class="btn icone" id="btnTema" type="button" aria-label="Alternar entre tema claro e escuro" title="Alternar tema claro/escuro">
        <svg class="ico-lua" viewBox="0 0 256 256" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></svg>
        <svg class="ico-sol" viewBox="0 0 256 256" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>
      </button>
    </header>

    <div class="aviso" id="aviso" role="alert" hidden></div>
    <div class="conversa">
      <main class="msgs" id="msgs" aria-live="polite"></main>
    </div>
    <div class="digitando" id="digitando"></div>

    <form class="compositor" id="form" autocomplete="off">
      <textarea id="txt" rows="1" placeholder="Escreva para a Aurora… (Enter envia, Shift+Enter quebra a linha)" aria-label="Mensagem"></textarea>
      <button class="btn primario" id="btnEnviar" type="submit">Enviar</button>
    </form>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
